[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
mew-agent = { workspace = true }
mew-cdp = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
# Phase 1: structured tracing spans around the UI -> agent handoff
# boundary. The actual log writer lives in `mew-agent::tracing_layer`;
# this dep is just the `tracing` macros and the `Subscriber` trait.
tracing = { workspace = true }
# Phase 10.3: env-filter + fmt layer so the tracing events the
# agent emits are quiet in release (`warn`-and-up) and detailed
# in debug (`info`-and-up). Override at runtime with RUST_LOG.
tracing-subscriber = { workspace = true }
