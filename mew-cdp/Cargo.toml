[package]
name = "mew-cdp"
version = "0.1.0"
edition = "2021"

[dependencies]
chromiumoxide.workspace = true
futures = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json.workspace = true
thiserror = "2.0.19"
# Phase 31: SPA navigation detection uses `url::Url::host_str` to
# extract the bare host from each iteration's URL. `url` is already
# a workspace dep (mew-nav uses it) so this just re-declares the
# same version at the leaf.
url.workspace = true

# Phase 3.3 (Bug 2): Windows Job Object support to ensure the
# chromiumoxide-launched Chromium process is killed when this crate's
# parent process exits — graceful or not. Without this, a Task
# Manager "End task" / `Stop-Process -Force` / SIGKILL of the parent
# leaves the chrome.exe children orphaned (the standard "18 chrome
# processes after a hard-kill" symptom). Feature-gated to
# `cfg(windows)`; Unix builds compile this out and use a Drop-based
# SIGTERM stub (also kills gracefully but not on SIGKILL'd parent —
# see the module docs in `src/process_lifetime.rs`).
[target.'cfg(windows)'.dependencies]
# Win32_System_RestartManager is added for the Phase X.1
# profile-lock-aware orphan reaper. The RmGetList / RmRegisterResources
# pair enumerates processes that hold handles to files inside our
# user_data_dir, which is the only reliable way to identify a
# zombie Chromium holding a SingletonLock / lockfile (the port-based
# sweep alone misses it because the zombie can be between
# listeners — e.g. on shutdown, or on a non-default debug port).
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_RestartManager",
    # Pass 3 (stale-lockfile cleanup) uses CreateFileW +
    # DeleteFileW, which live under Win32_Storage_FileSystem.
    "Win32_Storage_FileSystem",
] }

# Phase 5.2 review harness: the `phase5_2_dock` example drives a real
# agent task (sub-test E) and a real `mew_cdp::launch_headless` (A, B,
# F). It needs `mew-agent` for the agent loop and for the config
# loader. Workspace path dep, no separate crate published.
[dev-dependencies]
mew-agent = { path = "../mew-agent" }
# `reap_smoketest` enables a tracing subscriber so the
# reaper's debug/trace events surface on stderr. Only
# used by the example; the lib itself does not pull in
# `tracing-subscriber` (it would conflict with
# `tauri-plugin-log` for the global LogTracer; see
# `mew-cdp`'s comment on the no-tracing-subscriber-init
# pattern).
tracing-subscriber = { workspace = true }

# Unix (macOS/Linux) stub: Drop-based SIGTERM+SIGKILL for graceful
# shutdown. Does NOT cover a parent that is itself SIGKILL'd before
# Drop runs — see the module docs for the limitation and the
# `prctl(PR_SET_PDEATHSIG)` follow-up.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
