[package]
name = "mew-agent"
version = "0.1.0"
edition = "2021"

[features]
# Phase 9: the evaluation harness. The harness is opt-in because
# (a) it adds the `mew-resilience` mock-fixture module to the dep
# graph and (b) the runner is the right place for future
# live-LLM integration (kept out of the default build until that
# work lands). `cargo test --features eval -p mew-agent` runs the
# full regression suite; `cargo test -p mew-agent` (default)
# skips the eval-gated tests so a CI run on a host without the
# fixtures dir can still pass.
default = []
eval = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
mew-cdp = { path = "../mew-cdp" }
mew-perception = { path = "../mew-perception" }
mew-nav = { path = "../mew-nav" }
mew-resilience = { path = "../mew-resilience" }
mew-memory = { workspace = true }
chromiumoxide = { workspace = true }
url = { workspace = true }
rand = "0.8"
toml = "0.8"
urlencoding = "2.1.3"
# Phase 41: lead-gen result export. The `csv` crate
# provides the CSV writer used by `exporter::write_csv`.
# Picked from the workspace `[workspace.dependencies]`
# alias so a future crate can opt in without pulling a
# second copy.
csv = { workspace = true }

[dev-dependencies]
# Phase 41: test-only `tempfile` for the export unit
# tests. The spec's work-item says "use tempdir", but
# `tempfile` is the maintained successor to the now-archived
# `tempdir` crate (3.7.7, last release 2018) and exposes a
# drop-cleaning temp dir via the same `TempDir::new()` API.
# Test-only — `tempfile` is NOT in the production dep
# graph, only here.
tempfile = "3"

[[example]]
name = "phase9_eval_harness"
required-features = ["eval"]
