[workspace]
resolver = "2"
members = [
    "mew-cdp",
    "mew-perception",
    "mew-nav",
    "mew-agent",
    "mew-cli",
    "mew-ui/src-tauri",
]

[workspace.dependencies]
mew-cdp = { path = "mew-cdp" }
mew-perception = { path = "mew-perception" }
mew-nav = { path = "mew-nav" }
mew-agent = { path = "mew-agent" }

chromiumoxide = { version = "0.9.1" }
futures = "0.3"
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
