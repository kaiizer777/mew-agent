<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mew 15.2 test page — full success</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
  h1 { font-size: 1.4rem; }
  .thread { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
  .thread h2 { font-size: 1.05rem; margin: 0 0 0.5rem; }
  .thread textarea { width: 100%; min-height: 60px; box-sizing: border-box; padding: 0.5rem; font: inherit; }
  .thread button { margin-top: 0.5rem; padding: 0.4rem 0.8rem; background: #2563EB; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
  .thread .status { margin-top: 0.5rem; font-size: 0.9rem; color: #666; min-height: 1.2em; }
  .thread.sent .status { color: #16a34a; }
</style>
</head>
<body>
<h1>Messages — full success scenario</h1>
<p>All three message threads (Alice, Bob, Carol) are present. The model should be able to complete all three without retries.</p>

<section class="thread" data-thread="alice" id="thread-alice">
  <h2>Alice</h2>
  <textarea aria-label="Message to Alice" placeholder="Type your message to Alice"></textarea>
  <button aria-label="Send to Alice">Send</button>
  <div class="status"></div>
</section>

<section class="thread" data-thread="bob" id="thread-bob">
  <h2>Bob</h2>
  <textarea aria-label="Message to Bob" placeholder="Type your message to Bob"></textarea>
  <button aria-label="Send to Bob">Send</button>
  <div class="status"></div>
</section>

<section class="thread" data-thread="carol" id="thread-carol">
  <h2>Carol</h2>
  <textarea aria-label="Message to Carol" placeholder="Type your message to Carol"></textarea>
  <button aria-label="Send to Carol">Send</button>
  <div class="status"></div>
</section>

<script>
  document.querySelectorAll('.thread').forEach((thread) => {
    const btn = thread.querySelector('button');
    const ta = thread.querySelector('textarea');
    const status = thread.querySelector('.status');
    btn.addEventListener('click', () => {
      if (!ta.value.trim()) {
        status.textContent = 'Cannot send: empty message.';
        return;
      }
      thread.classList.add('sent');
      status.textContent = 'Sent.';
      ta.disabled = true;
      btn.disabled = true;
    });
  });
</script>
</body>
</html>
